<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
--bg: #0b0a10;
--card: #151221;
--card-border: #2d224d;
--primary: #9d4edd;
--accent: #00f0ff;
--text: #f0f0f5;
--text-dim: #9ca3af;
--danger: #ff0055;
--success: #00e676;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
.container { max-width: 950px; margin: 0 auto; }

header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; margin-bottom: 24px; box-shadow: 0 0 20px rgba(157, 78, 221, 0.15); }
.logo { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text-dim); padding: 10px 20px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-weight: bold; }
.tab-btn.active, .tab-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 15px rgba(157, 78, 221, 0.4); }

.tab-content { display: none; background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; }
.tab-content.active { display: block; }

.form-group { margin-bottom: 16px; }
label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 14px; }
input { width: 100%; padding: 12px 16px; background: #08070d; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
input:focus { border-color: var(--accent); }
.btn-submit { background: linear-gradient(135deg, var(--primary), #5a189a); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
.btn-submit:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(157, 78, 221, 0.5); }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--card-border); }
th { color: var(--text-dim); font-size: 13px; }
.progress-bar-bg { background: #08070d; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
.progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--primary)); height: 100%; }

.btn-action { background: #08070d; border: 1px solid var(--card-border); color: var(--text-dim); padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; transition: 0.2s; }
.btn-action:hover { color: #fff; border-color: var(--accent); }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; }
.modal.active { display: flex; }
.modal-content { background: var(--card); border: 1px solid var(--card-border); padding: 24px; border-radius: 16px; text-align: center; max-width: 320px; width: 90%; }
#qrcode { display: flex; justify-content: center; margin: 20px 0; padding: 10px; background: #fff; border-radius: 8px; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--accent); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; display: none; z-index: 2000; box-shadow: 0 0 20px rgba(0,240,255,0.3); }
#toast.show { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo"><i class="fa-solid fa-bolt"></i> IWICH PANEL</div>
<div style="font-size: 13px; color: var(--accent);"><i class="fa-solid fa-circle" style="font-size: 8px; color: var(--success);"></i> سرور آنلاین</div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tab-dashboard" onclick="switchTab('dashboard')"><i class="fa-solid fa-users"></i> کاربران</button>
  <button class="tab-btn" id="tab-add" onclick="switchTab('add')"><i class="fa-solid fa-user-plus"></i> ساخت کانفیگ جدید</button>
</div>

<!-- تب لیست کاربران -->
<div class="tab-content active" id="dashboard">
  <table>
    <thead>
      <tr>
        <th>نام کاربر</th>
        <th>حجم مصرفی</th>
        <th>انقضا</th>
        <th>عملیات</th>
      </tr>
    </thead>
    <tbody id="users-tbody"></tbody>
  </table>
</div>

<!-- تب افزودن کاربر -->
<div class="tab-content" id="add">
  <div class="form-group">
    <label>نام کاربر</label>
    <input type="text" id="new-username" placeholder="مثال: amir">
  </div>
  <div class="form-group">
    <label>UUID کاربر (اختیاری)</label>
    <input type="text" id="new-uuid" placeholder="برای تولید تصادفی خالی بگذارید">
  </div>
  <div class="form-group">
    <label>حجم (گیگابایت)</label>
    <input type="number" id="new-limit" value="30">
  </div>
  <div class="form-group">
    <label>اعتبار (روز)</label>
    <input type="number" id="new-days" value="30">
  </div>
  <button class="btn-submit" onclick="addUser()"><i class="fa-solid fa-plus"></i> ساخت و ذخیره کانفیگ</button>
</div>
</div>

<!-- مودال کیو‌آرکد -->
<div class="modal" id="qr-modal" onclick="closeModal()">
<div class="modal-content" onclick="event.stopPropagation()">
<h3 id="modal-title" style="margin-bottom: 10px; font-size: 16px;"></h3>
<div id="qrcode"></div>
<button class="btn-action" style="width: 100%; margin: 0; padding: 10px;" onclick="closeModal()">بستن</button>
</div>
</div>

<!-- توست اعلان -->
<div id="toast"><span id="toast-text"></span></div>

function renderUsers() {
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = '';
  users.forEach(user => {
    const percent = Math.min(100, Math.round((user.used / user.total) * 100));
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${user.name}</strong></td>
      <td style="min-width: 130px;">
        <div style="font-size: 12px;">${user.used} از ${user.total} GB (${percent}%)</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div>
      </td>
      <td>${user.daysLeft} روز</td>
      <td>
        <button class="btn-action" onclick="copyVless('${user.name}', '${user.uuid}')" title="کپی لینک"><i class="fa-regular fa-copy"></i></button>
        <button class="btn-action" onclick="showQR('${user.name}', '${user.uuid}')" title="نمایش QR"><i class="fa-solid fa-qrcode"></i></button>
        <button class="btn-action" onclick="deleteUser(${user.id})" title="حذف" style="color: var(--danger);"><i class="fa-solid fa-trash"></i></button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
}

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function addUser() {
  const name = document.getElementById('new-username').value.trim();
  const uuid = document.getElementById('new-uuid').value.trim() || generateUUID();
  const limit = parseFloat(document.getElementById('new-limit').value) || 30;
  const days = parseInt(document.getElementById('new-days').value) || 30;
  if (!name) { showToast('نام کاربر را وارد کنید'); return; }

  users.push({ id: Date.now(), name, uuid, used: 0, total: limit, daysLeft: days });
  renderUsers();
  document.getElementById('new-username').value = '';
  document.getElementById('new-uuid').value = '';
  switchTab('dashboard');
  showToast('کاربر با موفقیت اضافه شد');
}

function deleteUser(id) {
  users = users.filter(u => u.id !== id);
  renderUsers();
  showToast('کاربر حذف شد');
}

function copyVless(name, uuid) {
  const host = window.location.hostname || "your-sub.railway.app";
  const config = `vless://${uuid}@${host}:443?path=%2Fws-stream&security=tls&encryption=none&type=ws#Iwich%20${encodeURIComponent(name)}`;
  navigator.clipboard.writeText(config);
  showToast('لینک کانفیگ Iwich کپی شد');
}

function showQR(name, uuid) {
  const host = window.location.hostname || "your-sub.railway.app";
  const config = `vless://${uuid}@${host}:443?path=%2Fws-stream&security=tls&encryption=none&type=ws#Iwich%20${encodeURIComponent(name)}`;
  const qrContainer = document.getElementById('qrcode');
  document.getElementById('modal-title').innerText = 'کانفیگ: ' + name;
  qrContainer.innerHTML = '';
  new QRCode(qrContainer, { text: config, width: 170, height: 170 });
  document.getElementById('qr-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('qr-modal').classList.remove('active');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').innerText = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

renderUsers();
</script>
